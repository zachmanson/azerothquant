# Brain config. Copy this to brain/config.toml and edit the paths for your PC.
#
# Each [[installs]] entry is one WoW install folder the Brain reads from, and the
# Era its data belongs to ("beta" or "live"). Beta and Live data are never mixed,
# so every folder must be listed once, with exactly one Era.
#
# Use single quotes so Windows backslashes are taken literally.

# Optional: the longest time left, in minutes, in each Auction House time-left bucket
# (shortest first). Defaults to the Forever client's <30m, 30m-2h, 2-12h, >12h, capped at
# 24 h since Forever posts for 2, 8 or 24 h. Must come before the first [[installs]].
# time_left_max_minutes = [30, 120, 720, 1440]

# Optional: the longest gap, in minutes, between two Scans of a Market that still counts
# as an Observation Window. Only those gaps count toward Sell Rate (see ADR-0004).
# Defaults to 60. Must come before the first [[installs]].
# observation_window_max_minutes = 60

# Optional: a Scan older than its Market's latest imported one is merged into its place in
# time by re-matching the Market's Scans from it on. One more than pool_rematch_hours older
# is archived and left for the next `brain rebuild` instead (see ADR-0026). Defaults to 48.
# Must come before the first [[installs]].
# pool_rematch_hours = 48

# Optional: the Scan Pool (ADR-0026), off unless both pool_url and pool_key are set. With
# them, `brain watch` uploads your Scans, stripped of your Character, your own flags and
# item names, and downloads the other members' Scans into the Archive under pool/. Nothing
# else ever leaves the PC. `brain pool push` and `brain pool pull [--since YYYY-MM-DD]` sync
# by hand. Must come before the first [[installs]].
# pool_url = 'https://azerothquant-pool.<you>.workers.dev'
# pool_key = '<the key the pool admin gave you>'
# How often `brain watch` pulls, besides right before each import. Defaults to 5.
# pool_sync_minutes = 5
# How far back the first pull reaches. Defaults to 30.
# pool_backfill_days = 30
# A Pooled Scan with fewer Listings than pool_min_completeness (0 to 1) of the median of its
# Market's last pool_completeness_window (at least 3) Scans is most likely cut short: it's
# archived, not imported. Your own Scans are never turned away. Default to 0.8 and 10.
# pool_min_completeness = 0.8
# pool_completeness_window = 10

# Optional: how Fair Value is found. It averages the cheapest fair_value_slice_share of
# an Item Key's units in the latest Scan, leaving out units priced under
# fair_value_outlier_share of that slice's median (those are Flips, not the price).
# A Disappearance only counts as a Probable Sale when it was priced at most
# probable_sale_max_fair_value_multiple times the Fair Value of the Scan it was last seen
# in. Default to 0.15, 0.5 and 1.2. Must come before the first [[installs]].
# fair_value_slice_share = 0.15
# fair_value_outlier_share = 0.5
# probable_sale_max_fair_value_multiple = 1.2

# Optional: how many days back Sell Rate looks. Only the Observation Windows that ended in
# that many days before now count. Defaults to 14. Must come before the first [[installs]].
# sell_rate_days = 14

# Optional: how `brain recommend` decides. The Auction House keeps ah_cut of a sale at a
# faction Auction House and neutral_ah_cut at a neutral one. Only the held units Sell Rate
# says will sell within sale_horizon_days are worth Selling, and a Flip never buys more
# than that. A Flip to Sell must make at least flip_min_margin_share of its buy price and
# at least flip_min_margin_copper per unit. Default to 0.05, 0.15, 7, 0.2 and 100 (1 silver).
# Must come before the first [[installs]].
# ah_cut = 0.05
# neutral_ah_cut = 0.15
# sale_horizon_days = 7
# flip_min_margin_share = 0.2
# flip_min_margin_copper = 100

# Optional: the Sell Rate Prior, how much `brain recommend` discounts thin Sell Rate
# evidence. Before Sell Rate becomes a quantity, it's worked out as if this many more hours
# of Observation Windows had been watched with no sales, so one sale in a short window
# doesn't read as a fast seller.
# The discount fades as real window hours build up. Lenient for Holdings (too low a rate
# vendors what would have sold) and strict for Flips (too high a rate buys stock that
# sits). 0 turns it off. Default to 3 and 24 hours. Must come before the first [[installs]].
# sell_rate_prior_hours_holdings = 3
# sell_rate_prior_hours_flips = 24

# Optional: the Sale Size Prior, how much `brain recommend` discounts one big buyer. Sell
# Rate counts units, so one buyer taking a 20-stack reads like 20 sales. Before Sell Rate
# becomes a quantity, an Item Key's average Sale Event size is worked out as if this many
# more Sale Events of a typical size had been seen: the smaller of the Market's usual Sale
# Event among items that stack and the Item Key's usual Listing quantity.
# The discount fades as real Sale Events build up. Lenient for Holdings and strict for
# Flips, as above. 0 turns it off. Default to 1 and 5 Sale Events. Must come before the
# first [[installs]].
# sale_size_prior_events_holdings = 1
# sale_size_prior_events_flips = 5

# Optional: the least evidence `brain recommend` resells a buy on. A Flip to Sell, the Sell
# room of a Flip to Craft's output and the resale behind a Prediction buy's Max Loss need
# an Item Key's Sell Rate to rest on at least this many Sale Events: one or two can be a
# single seller cancelling. Below it the buy can still be Vendored. Holdings you already
# own aren't affected. Defaults to 3. Must come before the first [[installs]].
# flip_min_sale_events = 3

# Optional: how far `brain recommend` undercuts. A Flip to Sell is posted this many copper
# under the cheapest other player's Listing left once it's bought, so it sells first. A
# Listing of your own that's cheaper is matched instead. Your other Characters' Listings
# count as other players'. Defaults to 1. Must come before the first [[installs]].
# post_undercut_copper = 1

# Optional: the guards on Predictions (see predictions.example.toml and ADR-0006). A unit
# is only bought under a Prediction while its Max Loss, what it cost less what it would
# bring today if the Prediction is wrong, is at most prediction_max_loss_share of its cost.
# The gold under one Prediction, counting units you already hold at what they'd bring
# today, is capped at prediction_cap_share of the Market's pooled gold, and under all of
# them at predictions_cap_share. Default to 0.10, 0.15 and 0.40. Must come before the
# first [[installs]].
# prediction_max_loss_share = 0.10
# prediction_cap_share = 0.15
# predictions_cap_share = 0.40

# Optional: how `brain recommend` crafts (see ADR-0008). It crafts from held reagents,
# one craft at a time, the one that gains the most first, while a craft still gains more
# than craft_min_gain copper. Defaults to 0. Must come before the first [[installs]].
# craft_min_gain = 0
# A short reagent can be crafted too, with another Known Recipe (a Sub-craft, see
# ADR-0014), down to craft_chain_depth crafts deep, counting the top one. Defaults to 3.
# craft_chain_depth = 3

# Optional: `brain disenchants` checks the Disenchant tables against your own Disenchant
# Results, and only judges a group once it has this many (ADR-0018). Defaults to 20.
# Must come before the first [[installs]].
# disenchant_check_min_results = 20

# Optional: how many options the Shopping List shows, most profit first. Each is sized on
# its own, within the Budget set in game (or all the gold), so they're alternatives to
# pick from (#86). Defaults to 50. Must come before the first [[installs]].
# shopping_list_rows = 50
# Flips to Craft are cut apart, to craft_list_rows, and shown in their own Flips to Craft
# tab (#87). Defaults to 25.
# craft_list_rows = 25
# Flips to Disenchant likewise, to disenchant_list_rows, in their own Flips to Disenchant
# tab (#89). Defaults to 10.
# disenchant_list_rows = 10

# Optional: a Buy Under (the most a unit is worth paying on the Auction House, from its
# best way out less the Flip margin) shows only once at least buy_under_min_sightings
# distinct Scans in the last buy_under_window_days saw another player's Listing at or
# under it (#88). Defaults to 1 and 7. Must come before the first [[installs]].
# buy_under_min_sightings = 1
# buy_under_window_days = 7

# Optional: the Beta Prior (#90), a grey Beta price beside each Recommendation Table row,
# shows for beta_column_days from a Market's first Scan. Display only: nothing decides by
# it. 0 never shows it. Defaults to 14. Must come before the first [[installs]].
# beta_column_days = 14

# Optional: the Beta Sell Rate (#110, ADR-0024). For beta_column_days from a Market's first
# Scan, a Prediction buy's Max Loss may count on Beta's Sale Events, each as this share of
# a Sale Event (and each Beta Observation Window hour as this share of an hour), priced
# for Live by the Beta/Live Fair Value ratio. Nothing else reads it. Check the ratios with
# `brain recommend --beta-ratios` before turning it on. From 0 to 1, defaults to 0 (off).
# Must come before the first [[installs]].
# beta_sell_rate_weight = 0

# Optional: a Loot Alert (#54) flags a drop in game when one unit's Best Exit Value is at
# least the greater of loot_alert_share of the Market's pooled gold (0 to 1, defaults to
# 0.10) and loot_alert_floor gold (at least 0, defaults to 10). Display only. Must come
# before the first [[installs]].
# loot_alert_share = 0.10
# loot_alert_floor = 10

# Optional: when a Holdings Sell is hinted at as a good time to sell (#50): its ROI, what
# it nets after the cut over what its units cost on the Auction House, is at least this
# share. Only a hint; the Action stands either way. Defaults to 0.20. Must come before the
# first [[installs]].
# roi_hint = 0.20

# Optional: the hassle of an Item Key that doesn't stack (#73), one no Listing was ever
# seen with more than one unit of. Each unit is its own buy and its own post, so `brain
# recommend` charges a Flip this many copper for every such unit it buys on the Auction
# House and again for every one it posts: a Flip to Sell of 90 pays 180 times it, and a
# buy to Vendor pays only for the buy. What held units are worth isn't changed. 0 turns
# it off. Defaults to 500 (5 silver). Must come before the first [[installs]].
# non_stacking_effort_copper = 500

# Optional: Auction House deposits (#78, ADR-0013). Posting costs a deposit, refunded on
# a sale and lost each time a posting expires. `brain recommend` charges each unit it
# would post the deposits it expects that unit to lose while it waits its turn to sell,
# so slow sellers look as good as they are. The deposit per unit is learned from the
# latest Sold invoice of the Item Key; one never seen Sold is charged ah_deposit_share of
# its Vendor Price per posting (nothing without a Vendor Price). The 0.60 default is the
# 24 h rate, checked in game (Forever offers 2, 8 or 24 h). post_duration_hours must match the
# duration you post at (and the rate behind ah_deposit_share). Defaults to 0.60 and 24.
# Must come before the first [[installs]].
# ah_deposit_share = 0.60
# post_duration_hours = 24

# Optional: Sibling suffixes (#58, ADR-0022). Random suffixes split an item's sales thin,
# so a held unit's Sell Rate also counts the Sale Events of the item's other suffixes
# priced at or above its post price, each as this share of a Sale Event. Only held units:
# Flips and Buy Under never count them. 0 turns it off. From 0 to 1, defaults to 0.5.
# Must come before the first [[installs]].
# suffix_pool_weight = 0.5

# Optional: where the Brain keeps its history database. A relative path is relative to
# this file. Defaults to history.sqlite next to it. Must come before the first [[installs]].
# history_path = 'history.sqlite'

# Optional: where the Brain keeps the Archive, every Scan exactly as the Addon
# recorded it (see ADR-0005). The history database can be rebuilt from it with
# `brain rebuild`, but the archive itself can't be recreated, so consider pointing this
# at a synced or backed-up folder. A relative path is relative to this file. Defaults to
# archive next to it. Must come before the first [[installs]].
# archive_dir = 'archive'

[[installs]]
path = 'C:\Program Files (x86)\World of Warcraft\_classic_beta_'
era = "beta"

# Add the Live install once its folder name is known at launch:
# [[installs]]
# path = 'C:\Program Files (x86)\World of Warcraft\<live folder>'
# era = "live"
