# Brain config. Copy this to brain/config.toml and edit the paths for your PC.
#
# Each [[installs]] entry is one WoW install folder the Brain reads from, and the
# Era its data belongs to ("beta" or "live"). Beta and Live data are never mixed,
# so every folder must be listed once, with exactly one Era.
#
# Use single quotes so Windows backslashes are taken literally.

# Optional: the longest time left, in minutes, in each Auction House time-left bucket
# (shortest first). Defaults to retail's <30m, 30m-2h, 2-12h, 12-48h; still to be
# verified on Forever. Must come before the first [[installs]].
# time_left_max_minutes = [30, 120, 720, 2880]

# Optional: the longest gap, in minutes, between two Scans of a Market that still counts
# as an Observation Window. Only those gaps count toward Sell Rate (see ADR-0004).
# Defaults to 60. Must come before the first [[installs]].
# observation_window_max_minutes = 60

# Optional: how Fair Value is found. It averages the cheapest fair_value_slice_share of
# an Item Key's units in the latest Scan, leaving out units priced under
# fair_value_outlier_share of that slice's median (those are Flips, not the price).
# A Disappearance only counts as a Probable Sale when it was priced at most
# probable_sale_max_fair_value_multiple times the Fair Value of the Scan it was last seen
# in. Default to 0.15, 0.5 and 1.2. Must come before the first [[installs]].
# fair_value_slice_share = 0.15
# fair_value_outlier_share = 0.5
# probable_sale_max_fair_value_multiple = 1.2

# Optional: how many days back Sell Rate looks. Only the Observation Windows that ended in
# that many days before now count. Defaults to 14. Must come before the first [[installs]].
# sell_rate_days = 14

# Optional: how `brain recommend` decides. The Auction House keeps ah_cut of a sale at a
# faction Auction House and neutral_ah_cut at a neutral one. Only the held units Sell Rate
# says will sell within sale_horizon_days are worth Selling, and a Flip never buys more
# than that. A Flip to Sell must make at least flip_min_margin_share of its buy price and
# at least flip_min_margin_copper per unit. Default to 0.05, 0.15, 7, 0.2 and 100 (1 silver).
# Must come before the first [[installs]].
# ah_cut = 0.05
# neutral_ah_cut = 0.15
# sale_horizon_days = 7
# flip_min_margin_share = 0.2
# flip_min_margin_copper = 100

# Optional: the Sell Rate Prior, how much `brain recommend` discounts thin Sell Rate
# evidence. Before Sell Rate becomes a quantity, it's worked out as if this many more hours
# of Observation Windows had been watched with no sales, so one sale in a short window
# doesn't read as a fast seller.
# The discount fades as real window hours build up. Lenient for Holdings (too low a rate
# vendors what would have sold) and strict for Flips (too high a rate buys stock that
# sits). 0 turns it off. Default to 3 and 24 hours. Must come before the first [[installs]].
# sell_rate_prior_hours_holdings = 3
# sell_rate_prior_hours_flips = 24

# Optional: the Sale Size Prior, how much `brain recommend` discounts one big buyer. Sell
# Rate counts units, so one buyer taking a 20-stack reads like 20 sales. Before Sell Rate
# becomes a quantity, an Item Key's average Sale Event size is worked out as if this many
# more Sale Events of a typical size had been seen: the smaller of the Market's usual Sale
# Event among items that stack and the Item Key's usual Listing quantity.
# The discount fades as real Sale Events build up. Lenient for Holdings and strict for
# Flips, as above. 0 turns it off. Default to 1 and 5 Sale Events. Must come before the
# first [[installs]].
# sale_size_prior_events_holdings = 1
# sale_size_prior_events_flips = 5

# Optional: the least evidence `brain recommend` resells a buy on. A Flip to Sell, the Sell
# room of a Flip to Craft's output and the resale behind a Prediction buy's Max Loss need
# an Item Key's Sell Rate to rest on at least this many Sale Events: one or two can be a
# single seller cancelling. Below it the buy can still be Vendored. Holdings you already
# own aren't affected. Defaults to 3. Must come before the first [[installs]].
# flip_min_sale_events = 3

# Optional: the guards on Predictions (see predictions.example.toml and ADR-0006). A unit
# is only bought under a Prediction while its Max Loss, what it cost less what it would
# bring today if the Prediction is wrong, is at most prediction_max_loss_share of its cost.
# The gold under one Prediction, counting units you already hold at what they'd bring
# today, is capped at prediction_cap_share of the Market's pooled gold, and under all of
# them at predictions_cap_share. Default to 0.10, 0.15 and 0.40. Must come before the
# first [[installs]].
# prediction_max_loss_share = 0.10
# prediction_cap_share = 0.15
# predictions_cap_share = 0.40

# Optional: how `brain recommend` crafts (see ADR-0008). It crafts from held reagents,
# one craft at a time, the one that gains the most first, while a craft still gains more
# than craft_min_gain copper. Defaults to 0. Must come before the first [[installs]].
# craft_min_gain = 0

# Optional: where the Brain keeps its history database. A relative path is relative to
# this file. Defaults to history.sqlite next to it. Must come before the first [[installs]].
# history_path = 'history.sqlite'

# Optional: where the Brain keeps the Archive, every Scan exactly as the Addon
# recorded it (see ADR-0005). The history database can be rebuilt from it with
# `brain rebuild`, but the archive itself can't be recreated, so consider pointing this
# at a synced or backed-up folder. A relative path is relative to this file. Defaults to
# archive next to it. Must come before the first [[installs]].
# archive_dir = 'archive'

[[installs]]
path = 'C:\Program Files (x86)\World of Warcraft\_classic_beta_'
era = "beta"

# Add the Live install once its folder name is known at launch:
# [[installs]]
# path = 'C:\Program Files (x86)\World of Warcraft\<live folder>'
# era = "live"
