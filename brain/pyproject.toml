[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azerothquant-brain"
dynamic = ["version"]
description = "The Brain: imports Addon data and runs the Decision Engine offline."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brain = "brain.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Freezes AzerothQuantBrain.exe (AzerothQuantBrain.spec, #115).
build = ["pyinstaller>=6.10"]

[tool.setuptools.dynamic]
version = {attr = "brain.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
