# What Disenchanting an item yields, by Disenchant source group: quality (2 uncommon,
# 3 rare, 4 epic), armor (classID 4) or weapon (classID 2), and item level (ADR-0018).
#
# Re-derived by hand from the WoWWiki tables, CC BY-SA:
#   https://wowwiki-archive.fandom.com/wiki/Disenchanting_tables
#   https://wowwiki-archive.fandom.com/wiki/Disenchanting (required skill, exclusions)
# read from the Wayback Machine copies of 2025-01-21 and 2025-12-08. Only the Classic item
# levels are kept. The wiki says it's outdated, and Forever may differ (e.g. its "Arcane
# Salvager"): `brain disenchants` checks these against the player's own Disenchant
# Results. A mismatch is fixed by editing this file, never automatically.
#
# Each mat: `chance` of getting it at all, then an even pick of `min_qty`..`max_qty`
# ("80% 1-2x" is 40% 1x, 40% 2x). Expected qty per Disenchant: chance × (min + max) / 2.
# Gaps: nothing listed for epic item levels 81+ (e.g. Naxxramas), so those have no
# Disenchant way until a row is added.

# The Enchanting skill needed, by the highest item level each value covers. Confirmed on
# the Disenchanting page: 225 for item levels 61-99 (uncommon, rare) and 61-89 (epic),
# 300 for epics of 90-92.
required_skill = [
  [20, 1], [25, 25], [30, 50], [35, 75], [40, 100], [45, 125], [50, 150], [55, 175],
  [60, 200], [89, 225], [92, 300],
]

# Enchanter-made wands: green weapons that can't be Disenchanted.
excluded_item_ids = [11287, 11288, 11289, 11290]
# Shirts and tabards can't be Disenchanted. Neither can anything that can't be equipped
# (an empty equip slot), whatever its class.
excluded_equip_locs = ["INVTYPE_BODY", "INVTYPE_TABARD", "INVTYPE_NON_EQUIP_IGNORE"]

