name: CI

on:
  push:
  pull_request:

jobs:
  brain:
    name: Brain (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (requires-python) and the version used locally.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Lets the Lua-writer test check its output against real Lua (it skips without one).
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  addon:
    name: Addon (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # WoW runs Lua 5.1, so test against the same version.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - run: busted --directory=addon

  pool:
    name: Scan Pool Worker (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pool/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # A v* tag builds AzerothQuantBrain.exe and attaches it to a GitHub Release (#115),
  # once everything above passes.
  brain-exe:
    name: Release AzerothQuantBrain.exe
    needs: [brain, addon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: brain
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[build]"
      - name: Check the tag matches brain.__version__
        run: |
          version=$(python -c "import brain; print(brain.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but brain.__version__ is $version"
            exit 1
          fi
      - run: pyinstaller --noconfirm AzerothQuantBrain.spec
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/AzerothQuantBrain.exe --generate-notes
