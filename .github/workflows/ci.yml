name: CI

on:
  push:
  pull_request:

jobs:
  brain:
    name: Brain (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (requires-python) and the version used locally.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Lets the Lua-writer test check its output against real Lua (it skips without one).
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  addon:
    name: Addon (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # WoW runs Lua 5.1, so test against the same version.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - run: busted --directory=addon
